databases:
  - name: chronologs-db
    plan: free
    databaseName: chronologs
    user: chronologs

services:
  - type: redis
    name: chronologs-redis
    plan: free
    ipAllowList: []

  - type: web
    name: chronologs-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DB_NAME
        fromDatabase:
          name: chronologs-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: chronologs-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: chronologs-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: chronologs-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: chronologs-db
          property: port
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: chronologs-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: chronologs-redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_HOSTS
        sync: false  # set to your chronologs-backend.onrender.com hostname
      - key: CORS_ALLOWED_ORIGINS
        sync: false  # set to your chronologs-frontend.onrender.com URL

  - type: worker
    name: chronologs-celery-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: celery -A config worker --pool=solo -l info
    plan: free
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DB_NAME
        fromDatabase:
          name: chronologs-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: chronologs-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: chronologs-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: chronologs-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: chronologs-db
          property: port
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: chronologs-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: chronologs-redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: chronologs-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://chronologs-backend.onrender.com/api  # update if Render assigns a different hostname
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
